<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Día de la Madre</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            overflow: hidden;
        }

        .card-container {
            perspective: 1000px;
        }

        .card {
            width: 400px;
            height: 550px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
            cursor: pointer;
            animation: floatCard 3s ease-in-out infinite;
        }

        @keyframes floatCard {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .card:hover {
            animation: none;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .card-front {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .card-back {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            transform: rotateY(180deg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 50px;
        }

        .heart-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin-bottom: 30px;
        }

        .heart {
            width: 100px;
            height: 100px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            background: #ff4757;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        .heart:before,
        .heart:after {
            content: "";
            width: 100px;
            height: 100px;
            position: absolute;
            border-radius: 50%;
            background: #ff4757;
        }

        .heart:before {
            top: -50px;
            left: 0;
        }

        .heart:after {
            left: 50px;
            top: 0;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: translate(-50%, -50%) rotate(-45deg) scale(1);
            }
            25% {
                transform: translate(-50%, -50%) rotate(-45deg) scale(1.1);
            }
            50% {
                transform: translate(-50%, -50%) rotate(-45deg) scale(1);
            }
        }

        .title {
            font-size: 42px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            margin-bottom: 15px;
            animation: fadeInDown 1s ease-out;
            text-align: center;
        }

        .subtitle {
            font-size: 20px;
            color: #fff;
            opacity: 0.9;
            animation: fadeInUp 1s ease-out 0.3s backwards;
            text-align: center;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message {
            font-size: 22px;
            line-height: 1.8;
            color: #5a3e36;
            text-align: center;
            animation: fadeIn 1s ease-out 0.5s backwards;
            font-style: italic;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .signature {
            margin-top: 30px;
            font-size: 18px;
            color: #8b6f63;
            animation: fadeIn 1s ease-out 1s backwards;
        }

        .flower {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #ffb3ba;
            border-radius: 50%;
            opacity: 0;
            animation: floatFlower 4s ease-in-out infinite;
        }

        .flower:before,
        .flower:after {
            content: "";
            position: absolute;
            width: 40px;
            height: 40px;
            background: #ffdfba;
            border-radius: 50%;
        }

        .flower:before {
            top: -15px;
            left: 10px;
        }

        .flower:after {
            top: 10px;
            left: -15px;
        }

        .flower1 {
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .flower2 {
            top: 20%;
            right: 15%;
            animation-delay: 1s;
        }

        .flower3 {
            bottom: 15%;
            left: 15%;
            animation-delay: 2s;
        }

        .flower4 {
            bottom: 20%;
            right: 10%;
            animation-delay: 1.5s;
        }

        @keyframes floatFlower {
            0%, 100% {
                opacity: 0;
                transform: translateY(0) rotate(0deg);
            }
            10% {
                opacity: 0.7;
            }
            50% {
                opacity: 1;
                transform: translateY(-30px) rotate(180deg);
            }
            90% {
                opacity: 0.7;
            }
        }

        .click-hint {
            position: absolute;
            bottom: 20px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="card" id="card">
            <div class="card-face card-front">
                <div class="flower flower1"></div>
                <div class="flower flower2"></div>
                <div class="flower flower3"></div>
                <div class="flower flower4"></div>
                
                <div class="heart-container">
                    <div class="heart"></div>
                </div>
                
                <h1 class="title">Feliz Día<br>de la Madre</h1>
                <p class="subtitle">Con todo mi amor</p>
                
                <div class="click-hint">Haz clic para ver el mensaje ✨</div>
            </div>
            
            <div class="card-face card-back">
                <p class="message">
                    "Mamá, eres el abrazo que cura todo,<br>
                    la luz que guía mi camino<br>
                    y el amor más puro que conozco.<br><br>
                    Gracias por ser mi refugio,<br>
                    mi fuerza y mi hogar."
                </p>
                <p class="signature">Te amo ❤️</p>
            </div>
        </div>
    </div>

    <script>
        const card = document.getElementById('card');
        
        card.addEventListener('click', function() {
            this.classList.toggle('flipped');
        });
    </script>
</body>
</html>
